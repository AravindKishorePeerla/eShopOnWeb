name: eShopOnWeb Build and Test

# Trigger manually
on: workflow_dispatch

env:
  RESOURCE-GROUP: rg-eshoponweb-eastus
  LOCATION: South India
  TEMPLATE-FILE: infra/webapp.bicep
  SUBSCRIPTION-ID: 81ce95b5-bb6d-4e10-8a85-2258da864517
  WEBAPP-NAME: devops-webapp-eastus-24087522

jobs:
  buildandtest:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 9 (preview)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        dotnet-quality: 'preview'

    - name: Show dotnet info (diagnostic)
      run: dotnet --info

    - name: Restore solution (diagnostic)
      run: |
        mkdir -p ./artifacts
        dotnet restore ./eShopOnWeb.sln -v:d
        dotnet list ./eShopOnWeb.sln package --include-transitive > ./artifacts/package-tree.txt || true
        echo "Saved transitive package graph to ./artifacts/package-tree.txt"

    - name: Upload package list artifact (diagnostic)
      uses: actions/upload-artifact@v4
      with:
        name: package-list
        path: ./artifacts/package-tree.txt

    - name: Build with dotnet
      run: dotnet build ./eShopOnWeb.sln --configuration Release --no-restore

    - name: Test with dotnet
      run: dotnet test ./eShopOnWeb.sln --configuration Release --no-build --logger:"trx;LogFileName=test_results.trx"
      continue-on-error: false

    - name: dotnet publish
      run: |
        dotnet publish ./src/Web/Web.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp
        cd ${{ env.DOTNET_ROOT }}/myapp
        zip -r ../app.zip .

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: .net-app
        path: ${{ env.DOTNET_ROOT }}/app.zip

    - name: Upload bicep template artifact
      uses: actions/upload-artifact@v4
      with:
        name: bicep-template
        path: ${{ env.TEMPLATE-FILE }}

  deploy:
    runs-on: ubuntu-latest
    needs: buildandtest
    environment:
      name: 'Development'
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: .net-app
        path: .net-app

    - name: Download bicep template
      uses: actions/download-artifact@v4
      with:
        name: bicep-template
        path: bicep-template

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: deploy
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ env.SUBSCRIPTION-ID }}
        resourceGroupName: ${{ env.RESOURCE-GROUP }}
        template: bicep-template/webapp.bicep
        parameters: 'webAppName=${{ env.WEBAPP-NAME }} location=${{ env.LOCATION }}'
        failOnStdErr: false

    - name: Publish Website to WebApp
      uses: Azure/cli@v2
      with:
        inlineScript: |
             az webapp deploy --name ${{ env.WEBAPP-NAME }} --resource-group ${{ env.RESOURCE-GROUP }} --src-path .net-app/app.zip --type zip
